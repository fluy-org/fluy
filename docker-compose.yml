name: fluy

services:
  postgres:
    image: postgres:17-alpine
    container_name: fluy-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluy}
      POSTGRES_DB: ${POSTGRES_DB:-fluy}
    volumes:
      - fluy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fluy} -d ${POSTGRES_DB:-fluy}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fluy-postgres-data:
