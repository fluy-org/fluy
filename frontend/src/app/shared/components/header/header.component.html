<ion-toolbar class="header-toolbar">
  @if (voltarPara() || fechavel()) {
    <ion-buttons slot="start">
      @if (fechavel()) {
        <ion-button fill="clear" aria-label="Voltar" (click)="fechar.emit()"
          >‹</ion-button
        >
      } @else {
        <ion-back-button
          [defaultHref]="voltarPara()"
          text=""
          aria-label="Voltar"
        ></ion-back-button>
      }
    </ion-buttons>
    <ion-title class="marca-central"
      ><img src="assets/image/fluy-logo.png" alt="Fluy"
    /></ion-title>
  } @else {
    <div class="header-brand" slot="start">
      <img
        src="assets/image/fluy-logo.png"
        alt="Fluy"
        width="112"
        height="56"
      />
    </div>
  }

  <!-- Permite que cada tela acrescente botoes sem alterar este componente. -->
  <ion-buttons slot="end">
    <ng-content select="[header-actions]"></ng-content>
    @if (!fechavel()) {
      <ion-menu-button aria-label="Abrir menu do salão"></ion-menu-button>
    }
  </ion-buttons>
</ion-toolbar>
<div class="header-identification">
  <h1>{{ titulo() }}</h1>
</div>
