<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Fluy</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="theme-color" content="#e57d90" />
  <meta name="application-name" content="Fluy" />

  <link rel="icon" type="image/png" href="assets/icon/fluy-icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon/fluy-icon-180.png" />

  <script>
    (() => {
      const caminho = window.location.pathname;
      const rotaSalaoPublico = /^\/s\/[^/]+(?:\/.*)?$/.test(caminho);
      const entradaPwaCliente = caminho === '/cliente' || caminho === '/cliente/';
      const manifesto = document.createElement('link');

      manifesto.id = 'fluy-manifest';
      manifesto.rel = 'manifest';
      manifesto.href = rotaSalaoPublico || entradaPwaCliente
        ? '/manifest-cliente.webmanifest'
        : '/manifest.webmanifest';
      document.head.appendChild(manifesto);

      if (rotaSalaoPublico) {
        try {
          window.localStorage.setItem('fluy:pwa:rota-cliente', caminho);
        } catch {}
      }
    })();
  </script>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Fluy" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
